name: Recorder DB MCP
version: "0.4.0"
slug: recorder-db-mcp
description: Read-only MCP server for the Home Assistant recorder database (PostgreSQL)
url: https://github.com/Janhsen/ha-addons/tree/main/recorder-db-mcp
# Prebuilt image from .github/workflows/recorder-db-mcp.yml; only amd64 is built.
image: ghcr.io/janhsen/{arch}-addon-recorder-db-mcp
arch:
  - amd64
startup: application
boot: auto
apparmor: true
backup_exclude:
  - /data/secret_path
  - /data/rotate_marker
ports:
  8099/tcp: 9584
ports_description:
  8099/tcp: MCP endpoint (streamable HTTP, secret path)
watchdog: tcp://[HOST]:[PORT:8099]
options:
  db_url: ""
  max_rows: 5000
  statement_timeout_s: 30
  log_level: info
  rotate_secret: ""
  hide_404_log: true
  audit_log: true
schema:
  db_url: password
  max_rows: int(1,20000)
  statement_timeout_s: int(1,300)
  log_level: list(debug|info|warning|error)
  rotate_secret: str?
  hide_404_log: bool
  audit_log: bool
