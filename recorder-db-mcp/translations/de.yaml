configuration:
  db_url:
    name: Datenbank-URL
    description: >-
      Verbindungs-URL einer nur-lesenden PostgreSQL-Rolle, z. B. postgresql://leser:passwort@77b2833f-timescaledb/homeassistant
  max_rows:
    name: Maximale Zeilen
    description: Obergrenze für die Zeilen pro Abfrage.
  statement_timeout_s:
    name: Zeitlimit pro Abfrage (Sekunden)
    description: Längere Abfragen werden abgebrochen.
  log_level:
    name: Log-Level
    description: Ausführlichkeit des App-Protokolls.
  rotate_secret:
    name: Geheimen Pfad erneuern
    description: >-
      Beliebigen neuen Text eintragen und die App neu starten, dann wird ein neuer geheimer Pfad
      erzeugt (im Protokoll zu sehen). Der Connector muss danach mit dem neuen Pfad ersetzt werden.
  hide_404_log:
    name: 404-Zeilen im Protokoll ausblenden
    description: Blendet Zugriffe auf unbekannte Pfade (meist automatische Scanner) im Protokoll aus.
  audit_log:
    name: Aufrufe im Protokoll festhalten
    description: Schreibt für jeden Werkzeugaufruf Name, Dauer, Ergebnis und gekürzte Parameter (auch SQL) ins Protokoll.
  keep_connection_s:
    name: Verbindung offen halten (Sekunden)
    description: Wie lange eine Datenbankverbindung nach einer Abfrage offen bleibt, damit Folgeabfragen schneller sind. 0 = aus.
network:
  8099/tcp: MCP-Endpunkt (Streamable HTTP unter geheimem Pfad)
