configuration:
  db_url:
    name: Database URL
    description: >-
      Connection URL of a read-only PostgreSQL role, e.g. postgresql://reader:password@77b2833f-timescaledb/homeassistant
  max_rows:
    name: Maximum rows
    description: Upper limit of rows per query.
  statement_timeout_s:
    name: Query timeout (seconds)
    description: Longer queries are cancelled.
  log_level:
    name: Log level
    description: Verbosity of the app log.
  rotate_secret:
    name: Renew secret path
    description: >-
      Enter any new text and restart the app to create a new secret path (shown in the log).
      Replace the connector with the new path afterwards.
  hide_404_log:
    name: Hide 404 lines in the log
    description: Hides requests to unknown paths (mostly automated scanners) in the log.
  audit_log:
    name: Log tool calls
    description: Writes tool name, duration, result and shortened parameters (including SQL) of every call to the log.
  keep_connection_s:
    name: Keep connection open (seconds)
    description: How long a database connection stays open after a query so follow-up queries are faster. 0 = off.
network:
  8099/tcp: MCP endpoint (streamable HTTP under a secret path)
